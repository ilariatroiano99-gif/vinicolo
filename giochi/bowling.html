<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Bowling delle bottiglie · Vinicolo</title>
<style>
  :root{--wine:#58233C;--gold:#e8b24a;--gold2:#f4d08a;--cream:#f4ede2;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(120% 80% at 50% 0%,#2a140c,#120704 70%);color:var(--cream);display:flex;flex-direction:column;
    align-items:center;min-height:100svh;overflow:hidden;user-select:none;-webkit-user-select:none}
  a{color:var(--gold)}
  .top{width:100%;max-width:480px;display:flex;align-items:center;justify-content:space-between;padding:14px 16px calc(env(safe-area-inset-top))}
  .back{font-size:.82rem;text-decoration:none;color:var(--cream);opacity:.75}
  .mute{background:none;border:1px solid rgba(244,237,226,.25);color:var(--cream);width:38px;height:38px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.85}
  .score{width:100%;max-width:480px;padding:0 12px 8px;display:flex;gap:3px;overflow-x:auto}
  .fr{flex:1 0 auto;min-width:34px;border:1px solid rgba(244,237,226,.16);border-radius:7px;overflow:hidden;font-variant-numeric:tabular-nums}
  .fr.cur{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
  .fr .rolls{display:flex;height:19px;border-bottom:1px solid rgba(244,237,226,.14)}
  .fr .rolls b{flex:1;text-align:center;font-size:.72rem;line-height:19px;color:var(--gold2);border-left:1px solid rgba(244,237,226,.12)}
  .fr .rolls b:first-child{border-left:0}
  .fr .tot{text-align:center;font-size:.82rem;line-height:22px;font-weight:600}
  .stage{position:relative;width:100%;max-width:480px;padding:0 10px;flex:0 0 auto}
  canvas{display:block;width:100%;height:auto;border-radius:12px;background:#0d0603;touch-action:none;
    box-shadow:0 10px 40px rgba(0,0,0,.5),inset 0 0 0 1px rgba(122,47,82,.3)}
  .hint{width:100%;max-width:480px;text-align:center;font-size:.82rem;opacity:.7;padding:10px 16px;min-height:1.2em}
  .overlay{position:absolute;inset:0 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    background:rgba(18,7,4,.9);backdrop-filter:blur(3px);border-radius:12px;padding:26px;gap:14px}
  .overlay.hide{display:none}
  .overlay h1{font-family:Georgia,serif;font-weight:600;font-size:clamp(2rem,8vw,3rem);color:var(--gold);margin:0;line-height:1.05}
  .overlay h1 em{font-style:italic;color:var(--cream)}
  .overlay p{font-size:.95rem;opacity:.88;max-width:32ch;line-height:1.5;margin:0}
  .btn{border:none;border-radius:999px;padding:14px 32px;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;background:var(--gold);color:#2a0d1a}
  .btn:active{transform:translateY(1px)}
  .big{font-family:Georgia,serif;font-weight:700;font-size:3.4rem;color:var(--gold);line-height:1}
  .lbl{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;opacity:.7}
</style>
</head>
<body>
  <div class="top">
    <a class="back" href="../index.html#giochi">&#8592; Vinicolo</a>
    <button class="mute" id="mute" aria-label="Audio"></button>
  </div>
  <div class="score" id="board"></div>
  <div class="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay">
      <h1>Bowling <em>delle bottiglie</em></h1>
      <p>Fai rotolare il <b>tappo di sughero</b> in fondo alla pista e abbatti le bottiglie. Trascina il dito <b>verso l'alto</b> per mirare e dare forza, poi lascia. Dieci frame, come al bowling vero.</p>
      <button class="btn" id="startBtn">Gioca</button>
    </div>
    <div class="overlay hide" id="endOverlay">
      <div class="lbl">Partita finita</div>
      <div class="big" id="finalScore">0</div>
      <p id="endMsg"></p>
      <button class="btn" id="againBtn">Ancora</button>
    </div>
  </div>
  <div class="hint" id="hint">Trascina il dito verso l'alto per tirare.</div>

<script>
"use strict";
(function(){
  var cv=document.getElementById("game"), ctx=cv.getContext("2d");
  var W=360, H=640, DPR=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  cv.width=W*DPR; cv.height=H*DPR; cv.style.aspectRatio=(W/H).toFixed(4); ctx.scale(DPR,DPR);

  // ---- prospettiva ----
  var CX=180, HORIZON=150, NEAR_SY=606, PERSP=2.3, WY_MAX=1000;
  var LANE_HALF=140, WY_BACK=930, WY_MIN=18;
  function proj(wx,wy){ var d=wy/WY_MAX; var t=1/(1+d*PERSP); return {x:CX+wx*t, y:HORIZON+(NEAR_SY-HORIZON)*t, t:t}; }

  var PIN_R=15, BALL_R=17;
  var PIN_SPOTS=[[0,730],[-34,772],[34,772],[-68,814],[0,814],[68,814],[-102,856],[-34,856],[34,856],[102,856]];
  var pins=[], ball={x:0,y:60,vx:0,vy:0,r:BALL_R,m:2.2,ang:0};

  function makePins(){ pins=PIN_SPOTS.map(function(s){ return {ox:s[0],oy:s[1],x:s[0],y:s[1],vx:0,vy:0,r:PIN_R,m:1,down:false,fallT:0,fs:1,gone:false}; }); }
  function resetRack(){ makePins(); }
  function standingReset(){ pins.forEach(function(p){ if(!p.down){ p.x=p.ox; p.y=p.oy; p.vx=0; p.vy=0; } }); }
  function placeBall(){ ball.x=0; ball.y=60; ball.vx=0; ball.vy=0; ball.ang=0; }

  // ---- stato gioco ----
  var frame=0, ballInFrame=0, rolls=[], tenth=[], running=false, rolling=false, over=false, rollTime=0, standingBefore=10;
  var best=parseInt(localStorage.getItem("vin_bowling_best")||"0",10);

  function newGame(){ frame=0; ballInFrame=0; rolls=[]; tenth=[]; over=false; running=true; rolling=false;
    resetRack(); placeBall(); standingBefore=10; renderBoard(); setHint("Frame 1 · primo tiro. Trascina verso l'alto."); }

  // ---- fisica ----
  var FR=0.986, REST=0.85, STOPV=0.13, STEPS=3;
  function collide(a,b){
    var dx=b.x-a.x, dy=b.y-a.y, d=Math.sqrt(dx*dx+dy*dy), min=a.r+b.r;
    if(d===0){ dx=0.1; d=0.1; }
    if(d<min){
      var nx=dx/d, ny=dy/d, ov=min-d, tm=a.m+b.m;
      a.x-=nx*ov*(b.m/tm); a.y-=ny*ov*(b.m/tm); b.x+=nx*ov*(a.m/tm); b.y+=ny*ov*(a.m/tm);
      var rvx=b.vx-a.vx, rvy=b.vy-a.vy, vn=rvx*nx+rvy*ny;
      if(vn<0){ var j=-(1+REST)*vn/(1/a.m+1/b.m); a.vx-=j*nx/a.m; a.vy-=j*ny/a.m; b.vx+=j*nx/b.m; b.vy+=j*ny/b.m; }
    }
  }
  function walls(o){
    if(o.x<-LANE_HALF+o.r){ o.x=-LANE_HALF+o.r; o.vx=Math.abs(o.vx)*REST; }
    if(o.x>LANE_HALF-o.r){ o.x=LANE_HALF-o.r; o.vx=-Math.abs(o.vx)*REST; }
    if(o.y<WY_MIN+o.r){ o.y=WY_MIN+o.r; o.vy=Math.abs(o.vy)*REST; }
    if(o.y>WY_BACK-o.r){ o.y=WY_BACK-o.r; o.vy=-Math.abs(o.vy)*REST; }
  }
  function physics(){
    var objs=[ball].concat(pins.filter(function(p){ return !p.down; }));
    for(var s=0;s<STEPS;s++){
      for(var i=0;i<objs.length;i++){ var o=objs[i]; o.x+=o.vx/STEPS; o.y+=o.vy/STEPS; walls(o); }
      for(i=0;i<objs.length;i++) for(var k=i+1;k<objs.length;k++) collide(objs[i],objs[k]);
    }
    ball.ang+=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy)*0.05;
    for(i=0;i<objs.length;i++){ objs[i].vx*=FR; objs[i].vy*=FR;
      if(Math.abs(objs[i].vx)<STOPV) objs[i].vx=0; if(Math.abs(objs[i].vy)<STOPV) objs[i].vy=0; }
    pins.forEach(function(p){ if(!p.down){ var dd=Math.hypot(p.x-p.ox,p.y-p.oy); if(dd>p.r*1.2){ p.down=true; p.fallT=700; p.fs=(p.vx>=0?1:-1); } } });
  }
  function allStopped(){ if(Math.abs(ball.vx)>STOPV||Math.abs(ball.vy)>STOPV) return false;
    for(var i=0;i<pins.length;i++){ if(!pins[i].down && (Math.abs(pins[i].vx)>STOPV||Math.abs(pins[i].vy)>STOPV)) return false; }
    return true; }
  function standingCount(){ return pins.filter(function(p){ return !p.down; }).length; }

  // ---- flusso tiri ----
  function launch(vx,vy){ ball.vx=vx; ball.vy=vy; rolling=true; rollTime=0; }

  function onSettle(){
    rolling=false;
    var nowStanding=standingCount(), downed=standingBefore-nowStanding; if(downed<0) downed=0;
    rolls.push(downed);
    var strike=(ballInFrame===0 && downed===10);
    beep(strike?900:520, 0.12, "triangle", 0.06);
    if(frame<9){
      if(ballInFrame===0){
        if(strike){ frame++; ballInFrame=0; standingBefore=10; resetRack(); flash("Strike!"); }
        else { ballInFrame=1; standingReset(); standingBefore=nowStanding; }
      } else { if(downed>0 && nowStanding===0) flash("Spare!"); frame++; ballInFrame=0; standingBefore=10; resetRack(); }
    } else {
      tenth.push(downed);
      if(tenth.length===1){ if(downed===10){ resetRack(); flash("Strike!"); } else standingReset(); ballInFrame=1; standingBefore=standingCount(); }
      else if(tenth.length===2){
        var b1=tenth[0];
        if(b1===10){ if(tenth[1]===10){ resetRack(); flash("Strike!"); } else standingReset(); ballInFrame=2; standingBefore=standingCount(); }
        else if(tenth[0]+tenth[1]===10){ resetRack(); flash("Spare!"); ballInFrame=2; standingBefore=10; }
        else { endGame(); return; }
      } else { endGame(); return; }
    }
    placeBall(); renderBoard();
    setHint("Frame "+(frame+1)+(ballInFrame===0?" · primo tiro":" · secondo tiro")+". Trascina verso l'alto.");
  }
  function endGame(){ running=false; over=true;
    var total=computeTotal(rolls);
    if(total>best){ best=total; localStorage.setItem("vin_bowling_best",String(best)); }
    document.getElementById("finalScore").textContent=total;
    document.getElementById("endMsg").innerHTML="Record del locale: <b>"+best+"</b>. "+(total>=150?"Da campione.":total>=90?"Bella partita.":"Ci sta, riprova.");
    document.getElementById("endOverlay").classList.remove("hide"); renderBoard();
  }

  // ---- punteggio bowling ----
  function computeFrames(list){
    var fr=[], i=0, total=0;
    for(var f=0; f<10; f++){
      var o={rolls:[], score:null};
      if(i>=list.length){ fr.push(o); continue; }
      if(list[i]===10){ o.rolls=[10]; if(i+2<list.length){ total+=10+list[i+1]+list[i+2]; o.score=total; } i+=1; }
      else if(i+1<list.length){ var a=list[i], b=list[i+1]; o.rolls=[a,b];
        if(a+b===10){ if(i+2<list.length){ total+=10+list[i+2]; o.score=total; } } else { total+=a+b; o.score=total; } i+=2; }
      else { o.rolls=[list[i]]; i+=1; }
      fr.push(o);
    }
    return fr;
  }
  function computeTotal(list){ var fr=computeFrames(list), t=0; for(var i=0;i<fr.length;i++) if(fr[i].score!=null) t=fr[i].score; return t; }
  function rollSymbol(fr, idx, isTenth){ var r=fr.rolls; if(idx>=r.length) return "";
    if(r[idx]===10 && (idx===0 || isTenth)) return "X";
    if(idx>0 && r[idx-1]!==10 && r[idx-1]+r[idx]===10) return "/";
    if(isTenth && idx>0 && r[idx-1]===10) return r[idx]===10?"X":String(r[idx]);
    if(r[idx]===0) return "-"; return String(r[idx]); }
  function renderBoard(){ var fr=computeFrames(rolls), b=document.getElementById("board"); b.innerHTML="";
    for(var f=0; f<10; f++){ var el=document.createElement("div"); el.className="fr"+(f===frame&&!over?" cur":"");
      var cells=f===9?3:2, rr=document.createElement("div"); rr.className="rolls"; var frd=fr[f];
      for(var c=0;c<cells;c++){ var bb=document.createElement("b"); bb.textContent=frd?rollSymbol(frd,c,f===9):""; rr.appendChild(bb); }
      var tt=document.createElement("div"); tt.className="tot"; tt.textContent=frd&&frd.score!=null?frd.score:"";
      el.appendChild(rr); el.appendChild(tt); b.appendChild(el); }
  }

  // ---- mira ----
  var aiming=false, aimStart=null, aimCur=null;
  function cpt(e){ var r=cv.getBoundingClientRect(), t=e.touches?e.touches[0]:e; return {x:(t.clientX-r.left)/r.width*W, y:(t.clientY-r.top)/r.height*H}; }
  function beginAim(e){ if(!running||rolling||over) return; e.preventDefault(); aiming=true; aimStart=cpt(e); aimCur=aimStart; }
  function moveAim(e){ if(!aiming) return; e.preventDefault(); aimCur=cpt(e); }
  function endAim(e){ if(!aiming) return; e.preventDefault(); aiming=false;
    var dx=aimCur.x-aimStart.x, dy=aimCur.y-aimStart.y, len=Math.sqrt(dx*dx+dy*dy);
    if(len<12 || dy>-6){ aimStart=aimCur=null; return; }
    var power=Math.min(len,150)/150, speed=6.5+power*11, nx=dx/len, ny=-dy/len;
    launch(nx*speed, ny*speed); aimStart=aimCur=null;
  }
  cv.addEventListener("touchstart",beginAim,{passive:false});
  cv.addEventListener("touchmove",moveAim,{passive:false});
  cv.addEventListener("touchend",endAim,{passive:false});
  cv.addEventListener("mousedown",beginAim); window.addEventListener("mousemove",moveAim); window.addEventListener("mouseup",endAim);

  // ---- audio ----
  var AC=null, muted=(localStorage.getItem("vin_mute")==="1");
  function beep(f,d,t,g){ if(muted)return; try{ if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(),ga=AC.createGain(); o.type=t||"sine"; o.frequency.value=f; ga.gain.value=g||0.05;
    o.connect(ga); ga.connect(AC.destination); o.start(); ga.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d); o.stop(AC.currentTime+d);}catch(e){} }
  function renderMute(){ document.getElementById("mute").innerHTML=muted
    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f4ede2" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9H4z"/><line x1="17" y1="9" x2="23" y2="15"/><line x1="23" y1="9" x2="17" y2="15"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f4ede2" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8a5 5 0 0 1 0 8"/></svg>'; }
  var flashTxt="", flashT=0;
  function flash(t){ flashTxt=t; flashT=1100; beep(880,0.12,"triangle",0.06); }
  function setHint(t){ document.getElementById("hint").textContent=t; }

  // ---- disegno ----
  function draw(){
    ctx.clearRect(0,0,W,H);
    // parete di fondo (cantina)
    var bw=ctx.createLinearGradient(0,0,0,HORIZON+70); bw.addColorStop(0,"#1b0d08"); bw.addColorStop(1,"#3a1e12");
    ctx.fillStyle=bw; ctx.fillRect(0,0,W,HORIZON+80);
    // pedana pin (deck) scura dietro
    var deckL=proj(-LANE_HALF,WY_BACK), deckR=proj(LANE_HALF,WY_BACK), pinL=proj(-LANE_HALF,700), pinR=proj(LANE_HALF,700);
    ctx.fillStyle="#241109"; ctx.beginPath(); ctx.moveTo(pinL.x,pinL.y); ctx.lineTo(pinR.x,pinR.y); ctx.lineTo(deckR.x,deckR.y); ctx.lineTo(deckL.x,deckL.y); ctx.closePath(); ctx.fill();
    // pista (trapezio legno)
    var nL=proj(-LANE_HALF,0), nR=proj(LANE_HALF,0), fL=proj(-LANE_HALF,700), fR=proj(LANE_HALF,700);
    var lg=ctx.createLinearGradient(0,fL.y,0,nL.y); lg.addColorStop(0,"#8a5f36"); lg.addColorStop(.5,"#9c6c3d"); lg.addColorStop(1,"#7a5330");
    ctx.fillStyle=lg; ctx.beginPath(); ctx.moveTo(nL.x,nL.y); ctx.lineTo(nR.x,nR.y); ctx.lineTo(fR.x,fR.y); ctx.lineTo(fL.x,fL.y); ctx.closePath(); ctx.fill();
    // doghe convergenti
    ctx.strokeStyle="rgba(60,35,15,.4)"; ctx.lineWidth=1;
    for(var b=-LANE_HALF+20;b<LANE_HALF;b+=26){ var a1=proj(b,0), a2=proj(b,700); ctx.beginPath(); ctx.moveTo(a1.x,a1.y); ctx.lineTo(a2.x,a2.y); ctx.stroke(); }
    // canaline laterali
    ctx.fillStyle="#160a05";
    var gLa=proj(-LANE_HALF,0), gLb=proj(-LANE_HALF,700); ctx.beginPath(); ctx.moveTo(gLa.x,gLa.y); ctx.lineTo(gLa.x-14,gLa.y); ctx.lineTo(gLb.x-5,gLb.y); ctx.lineTo(gLb.x,gLb.y); ctx.closePath(); ctx.fill();
    var gRa=proj(LANE_HALF,0), gRb=proj(LANE_HALF,700); ctx.beginPath(); ctx.moveTo(gRa.x,gRa.y); ctx.lineTo(gRa.x+14,gRa.y); ctx.lineTo(gRb.x+5,gRb.y); ctx.lineTo(gRb.x,gRb.y); ctx.closePath(); ctx.fill();
    // frecce di mira a metà pista
    ctx.fillStyle="rgba(232,178,74,.5)";
    for(var ar=-2;ar<=2;ar++){ var p=proj(ar*46,300), sz=6*p.t*1.6; ctx.beginPath(); ctx.moveTo(p.x,p.y-sz); ctx.lineTo(p.x-sz*.7,p.y+sz*.6); ctx.lineTo(p.x+sz*.7,p.y+sz*.6); ctx.closePath(); ctx.fill(); }
    // linea di fallo
    var f1=proj(-LANE_HALF,40), f2=proj(LANE_HALF,40); ctx.strokeStyle="rgba(232,178,74,.55)"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(f1.x,f1.y); ctx.lineTo(f2.x,f2.y); ctx.stroke();

    // standees (bottiglie in piedi/che cadono + palla) ordinate dal fondo
    var draws=[];
    for(var i=0;i<pins.length;i++){ if(!pins[i].gone) draws.push({t:"pin",o:pins[i],wy:pins[i].y}); }
    draws.push({t:"ball",o:ball,wy:ball.y});
    draws.sort(function(a,b2){ return b2.wy-a.wy; });
    for(i=0;i<draws.length;i++){ if(draws[i].t==="pin") drawBottle(draws[i].o); else drawBall(); }

    // guida di mira
    if(aiming && aimStart && aimCur){ var dx=aimCur.x-aimStart.x, dy=aimCur.y-aimStart.y, len=Math.sqrt(dx*dx+dy*dy);
      if(len>12 && dy<-6){ var nx=dx/len, ny=-dy/len, pw=Math.min(len,150);
        var p0=proj(ball.x,ball.y), p1=proj(ball.x+nx*pw*1.6, ball.y+ny*pw*2.2);
        ctx.strokeStyle="rgba(244,208,138,.8)"; ctx.lineWidth=3; ctx.setLineDash([6,7]);
        ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle="rgba(244,208,138,.9)"; ctx.beginPath(); ctx.arc(p1.x,p1.y,4,0,7); ctx.fill(); } }

    // flash
    if(flashT>0){ ctx.globalAlpha=Math.min(1,flashT/300); ctx.fillStyle="#f4d08a"; ctx.font="italic 700 42px Georgia,serif"; ctx.textAlign="center";
      ctx.fillText(flashTxt, W/2, 250); ctx.globalAlpha=1; }
  }

  function drawBottle(p){
    var pr=proj(p.x,p.y), t=pr.t, hgt=76*t, wid=24*t;
    var topple = p.down ? Math.min(1,(700-p.fallT)/380) : 0;
    var alpha = p.down ? (p.fallT<200?Math.max(0,p.fallT/200):1) : 1;
    // ombra
    ctx.globalAlpha=alpha*0.32; ctx.fillStyle="#000"; ctx.beginPath(); ctx.ellipse(pr.x,pr.y+2*t,wid*0.7,wid*0.32,0,0,7); ctx.fill(); ctx.globalAlpha=alpha;
    ctx.save(); ctx.translate(pr.x,pr.y); ctx.rotate(topple*1.35*p.fs);
    // corpo bottiglia (in piedi: base a y=0, sale)
    var g=ctx.createLinearGradient(-wid/2,0,wid/2,0); g.addColorStop(0,"#274420"); g.addColorStop(.45,"#4f7d3f"); g.addColorStop(.6,"#6ea04f"); g.addColorStop(1,"#274420");
    ctx.fillStyle=g; ctx.beginPath();
    ctx.moveTo(-wid/2, 0); ctx.lineTo(-wid/2, -hgt*0.55);
    ctx.quadraticCurveTo(-wid/2, -hgt*0.72, -wid*0.22, -hgt*0.78);
    ctx.lineTo(-wid*0.22, -hgt*0.92); ctx.lineTo(wid*0.22, -hgt*0.92);
    ctx.lineTo(wid*0.22, -hgt*0.78);
    ctx.quadraticCurveTo(wid/2, -hgt*0.72, wid/2, -hgt*0.55);
    ctx.lineTo(wid/2, 0); ctx.closePath(); ctx.fill();
    // capsula
    ctx.fillStyle="#8a1330"; ctx.fillRect(-wid*0.22,-hgt*0.98,wid*0.44,hgt*0.1);
    // etichetta
    ctx.fillStyle="rgba(244,237,226,.9)"; ctx.fillRect(-wid*0.42,-hgt*0.42,wid*0.84,hgt*0.24);
    ctx.fillStyle="rgba(120,30,54,.8)"; ctx.fillRect(-wid*0.42,-hgt*0.36,wid*0.84,hgt*0.03);
    // riflesso
    ctx.fillStyle="rgba(255,255,255,.28)"; ctx.fillRect(-wid*0.34,-hgt*0.7,wid*0.12,hgt*0.55);
    ctx.restore(); ctx.globalAlpha=1;
  }
  function drawBall(){
    var pr=proj(ball.x,ball.y), t=pr.t, r=BALL_R*t*1.15;
    ctx.globalAlpha=0.34; ctx.fillStyle="#000"; ctx.beginPath(); ctx.ellipse(pr.x,pr.y+r*0.5,r*1.05,r*0.42,0,0,7); ctx.fill(); ctx.globalAlpha=1;
    ctx.save(); ctx.translate(pr.x,pr.y-r*0.4); ctx.rotate(ball.ang);
    var g=ctx.createRadialGradient(-r*0.3,-r*0.3,r*0.15,0,0,r); g.addColorStop(0,"#ecd09a"); g.addColorStop(1,"#b98d4f");
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill();
    ctx.strokeStyle="rgba(120,80,35,.5)"; ctx.lineWidth=Math.max(1,1.4*t);
    for(var k=-1;k<=1;k++){ ctx.beginPath(); ctx.moveTo(-r*0.8,k*r*0.32); ctx.lineTo(r*0.8,k*r*0.32); ctx.stroke(); }
    ctx.restore();
  }

  // ---- loop ----
  function loop(){ requestAnimationFrame(loop);
    if(running && rolling){ physics(); rollTime+=16; if((rollTime>500 && allStopped()) || rollTime>6500) onSettle(); }
    for(var i=0;i<pins.length;i++){ var p=pins[i]; if(p.down && !p.gone){ p.fallT-=16; if(p.fallT<=0) p.gone=true; } }
    if(flashT>0) flashT-=16;
    try{ draw(); }catch(e){}
  }

  document.getElementById("startBtn").addEventListener("click",function(){ document.getElementById("overlay").classList.add("hide"); document.getElementById("endOverlay").classList.add("hide"); if(AC&&AC.state==="suspended")AC.resume(); newGame(); });
  document.getElementById("againBtn").addEventListener("click",function(){ document.getElementById("endOverlay").classList.add("hide"); newGame(); });
  document.getElementById("mute").addEventListener("click",function(){ muted=!muted; localStorage.setItem("vin_mute",muted?"1":"0"); renderMute(); });

  makePins(); placeBall(); renderMute(); renderBoard(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
