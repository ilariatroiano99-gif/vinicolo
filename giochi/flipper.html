<title>Il flipper della tavola · Vinicolo</title>
<style>
  :root{--wine:#58233C;--gold:#e8b24a;--gold2:#f4d08a;--cream:#f4ede2;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

  a{color:var(--gold)}
  .top{width:100%;max-width:560px;height:46px;flex:0 0 46px;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
  .back{font-size:.82rem;text-decoration:none;color:var(--cream);opacity:.75}
  .mute{background:none;border:1px solid rgba(244,237,226,.25);color:var(--cream);width:34px;height:34px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.85}
  .score{width:100%;max-width:520px;height:56px;flex:0 0 56px;padding:0 14px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;overflow:hidden}

  .overlay.hide{display:none}
  .overlay h1{font-family:Georgia,serif;font-weight:600;font-size:clamp(1.9rem,7vw,2.8rem);color:var(--gold);margin:0;line-height:1.05}

<body>
  <div class="top">
    <a class="back" href="../index.html#giochi">&#8592; Vinicolo</a>
    <button class="mute" id="mute" aria-label="Audio"></button>
  </div>

  <div class="stage">
    <canvas id="game" width="520" height="1024"></canvas>

    <div class="overlay" id="overlay">
      <h1>Il flipper <em>della tavola</em></h1>
      <p>Un tappo di sughero su una tavola apparecchiata. Abbatti <b>V I N O</b>, riempi i calici, completa il tagliere.</p>
      <div class="rows" id="legenda"></div>
      <button class="btn" id="startBtn">Gioca</button>
    </div>

    <div class="overlay hide" id="endOverlay">
      <span class="lbl">Partita finita</span>
      <div class="big" id="finale">0</div>
      <p id="messaggio"></p>
      <button class="btn" id="againBtn">Ancora</button>
    </div>
  </div>

  <div class="hint" id="hint">Tieni premuto in basso, poi molla per lanciare.</div>

<script>
(function(){
"use strict";

/* ══════════════════════════════════════════════════════════════════
   IL FLIPPER DELLA TAVOLA
   Tavolo in unità proprie 520 x 880, y verso il basso.
   Fisica a passi piccoli: 8 sotto-passi per fotogramma, così il tappo
   non attraversa i muri nemmeno quando va forte.
   ══════════════════════════════════════════════════════════════════ */

var W = 520, H = 880;          // il tavolo, in unita' sue
var HTELA = 1024;              // la tela: tavolo piu' cruscotto in cima
var PIANO_Y = HTELA - H;       // dove comincia il tavolo dentro la tela
var cv = document.getElementById("game");
var cx = cv.getContext("2d");

/* ── colori ─────────────────────────────────────────────────────── */
var C = {
  cassa:    "#241119",
  cassaLuce:"#3d1f2a",
  fondo:    "#3a1526",
  fondoScuro:"#240d18",
  legno:    "#5a3520",
  legnoChiaro:"#7d4d2c",
  carta:    "#e6dcc4",
  cartaOmbra:"#cbbf9f",
  vino:     "#58233C",
  vinoVivo: "#8d3355",
  ruggine:  "#be6b34",
  oro:      "#e8b24a",
  oroChiaro:"#f4d08a",
  crema:    "#f4ede2",
  verde:    "#2f6b46",
  sughero:  "#c9964f",
  sugheroScuro:"#96652f",
  rail:     "#d8cdbb",
  railOmbra:"#8a7f6d"
};

/* ── suono, come negli altri giochi ─────────────────────────────── */
var AC = null, muted = (localStorage.getItem("vin_mute") === "1");
function beep(f, d, t, g){
  if(muted) return;
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    var o = AC.createOscillator(), ga = AC.createGain();
    o.type = t || "sine"; o.frequency.value = f; ga.gain.value = g || 0.05;
    o.connect(ga); ga.connect(AC.destination); o.start();
    ga.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d);
    o.stop(AC.currentTime + d);
  }catch(e){}
}
function renderMute(){
  document.getElementById("mute").innerHTML = muted
    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f4ede2" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9H4z"/><line x1="17" y1="9" x2="23" y2="15"/><line x1="23" y1="9" x2="17" y2="15"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f4ede2" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8a5 5 0 0 1 0 8"/></svg>';
}
document.getElementById("mute").addEventListener("click", function(){
  muted = !muted; localStorage.setItem("vin_mute", muted ? "1" : "0"); renderMute();
});
renderMute();

/* ══════════════════════════════════════════════════════════════════
   IL TAVOLO
   ══════════════════════════════════════════════════════════════════ */

var muri = [];      // segmenti fissi {ax,ay,bx,by,r,rimb,tipo}
var perni = [];     // cerchi fissi {x,y,r,rimb,tipo}
var respinte = [];  // i calici {x,y,r,...}
var bersagli = [];  // V I N O
var luciArco = [];  // le etichette del bancone
var fette = [];     // la corona del tagliere
var fionde = [];    // gli spicchi di formaggio

var GRUPPO = 0;
function muro(ax, ay, bx, by, opt){
  opt = opt || {};
  muri.push({ax:ax, ay:ay, bx:bx, by:by, r:opt.r||0,
             rimb:opt.rimb===undefined?0.36:opt.rimb, tipo:opt.tipo||"muro",
             gruppo: opt.gruppo !== undefined ? opt.gruppo : ++GRUPPO});
}
function arco(ccx, ccy, rad, da, a, passo, opt){
  // da e a in gradi; genera una catena di segmenti, tutti dello stesso gruppo
  passo = passo || 6;
  opt = opt || {}; opt.gruppo = ++GRUPPO;
  var prev = null;
  for(var g = da; g <= a + 0.001; g += passo){
    var t = g * Math.PI / 180;
    var p = {x: ccx + Math.cos(t)*rad, y: ccy + Math.sin(t)*rad};
    if(prev) muro(prev.x, prev.y, p.x, p.y, opt);
    prev = p;
  }
  return prev;
}
function perno(x, y, r, opt){
  opt = opt || {};
  perni.push({x:x, y:y, r:r, rimb:opt.rimb===undefined?0.5:opt.rimb, tipo:opt.tipo||"perno"});
}

/* ── geometria dell'arco: il bancone ────────────────────────────── */
var ARCO = {cx:260, cy:300, rOut:244, rIn:196};

function costruisciTavolo(){
  muri.length = 0; perni.length = 0;

  // arco esterno e interno (il canale del bancone)
  arco(ARCO.cx, ARCO.cy, ARCO.rOut, 180, 360, 4, {rimb:0.30});
  arco(ARCO.cx, ARCO.cy, ARCO.rIn,  180, 360, 4, {rimb:0.30});

  // pareti verticali sotto l'arco
  muro(16, 300, 16, 838, {rimb:0.30});           // muro esterno sinistro
  muro(64, 300, 64, 430, {rimb:0.30});           // canale sinistro, parete interna
  muro(504, 300, 504, 856, {rimb:0.30});         // muro esterno destro
  muro(456, 300, 456, 856, {rimb:0.30});         // canale di lancio, parete sinistra
  muro(456, 856, 504, 856, {rimb:0.10});         // fondo del canale di lancio

  // scivolo all'uscita del canale sinistro: prende tutta la larghezza del
  // canale, se no il tappo gli passa accanto e finisce dritto nella corsia
  muro(16, 468, 150, 522, {rimb:0.26});

  // imbuto in fondo
  muro(16, 838, 128, 876, {rimb:0.20});
  muro(456, 838, 344, 876, {rimb:0.20});

  // separatori corsia esterna / corsia interna
  muro(54, 640, 76, 782, {r:4, rimb:0.30});
  muro(418, 640, 396, 782, {r:4, rimb:0.30});
  // pavimento della corsia interna: senza, il tappo scendeva a fianco
  // dell'aletta e cadeva nel vuoto senza nemmeno sfiorarla
  muro(76, 782, 140, 792, {r:4, rimb:0.22});
  muro(396, 782, 332, 792, {r:4, rimb:0.22});

  // Il tagliere resta a filo del piano e il tappo ci rotola sopra accendendo
  // le fette: su un flipper vero il centro e' libero, se no il tiro dal centro
  // rimbalza subito giu' e non c'e' gioco. A tenere viva la pallina ci pensano
  // i respingenti in alto, le rampe e le fionde.
  // Paletti che deviano senza chiudere la corsia centrale:
  perno(236, 500, 9, {rimb:0.62});
  perno(158, 588, 10, {rimb:0.66});
  perno(314, 588, 10, {rimb:0.66});
  perno(196, 690, 9, {rimb:0.66});
  perno(276, 690, 9, {rimb:0.66});

  // paletti alti, sotto i bersagli
  perno(120, 300, 8, {rimb:0.55});
  perno(352, 300, 8, {rimb:0.55});

  // spicchi di formaggio (fionde): tre lati, quello attivo e' il primo
  // specchiati rispetto al centro del campo (x=236): prima quello destro era
  // molto piu' vicino al muro e il tappo cadeva quasi sempre a sinistra
  fionde = [
    {ax:104, ay:678, bx:176, by:722, cx:108, cy:754, lato:"sx", flash:0},
    {ax:368, ay:678, bx:296, by:722, cx:364, cy:754, lato:"dx", flash:0}
  ];
  fionde.forEach(function(f){
    muro(f.ax, f.ay, f.bx, f.by, {rimb:0.30, tipo:"fionda"});
    muro(f.bx, f.by, f.cx, f.cy, {rimb:0.30, tipo:"fionda"});
    muro(f.cx, f.cy, f.ax, f.ay, {rimb:0.30});
  });

  // i tre calici
  respinte = [
    {x:182, y:352, r:29, colpi:0, flash:0},
    {x:296, y:340, r:29, colpi:0, flash:0},
    {x:238, y:432, r:29, colpi:0, flash:0}
  ];

  // i bersagli V I N O
  bersagli = [];
  var lettere = ["V","I","N","O"];
  for(var i = 0; i < 4; i++){
    bersagli.push({x:148 + i*42, y:214, w:15, h:30, giu:false, lettera:lettere[i], flash:0});
  }

  // le cinque etichette del bancone, lungo l'arco
  luciArco = [];
  var angoli = [204, 232, 260, 288, 316];
  for(var k = 0; k < 5; k++){
    var t = angoli[k] * Math.PI / 180;
    var rr = (ARCO.rOut + ARCO.rIn) / 2;
    luciArco.push({x:ARCO.cx + Math.cos(t)*rr, y:ARCO.cy + Math.sin(t)*rr, on:false, ang:t});
  }

  // la corona del tagliere: sedici fette
  fette = [];
  for(var s = 0; s < 16; s++){
    var a = (s / 16) * Math.PI * 2 - Math.PI/2;
    fette.push({x:236 + Math.cos(a)*100, y:626 + Math.sin(a)*100, on:false, ang:a});
  }
}
costruisciTavolo();

/* ── le rampe: percorsi guidati, non muri ───────────────────────── */
var RAMPE = [
  { nome:"cavatappi", stile:"filo",
    bocca:{x:92, y:556, r:20},
    via:[{x:92,y:556},{x:78,y:496},{x:76,y:428},{x:90,y:364},{x:120,y:308},
         {x:160,y:272},{x:206,y:258}],
    uscita:{vx:150, vy:300}, punti:1500 },
  { nome:"forno", stile:"pianale",
    bocca:{x:388, y:530, r:20},
    via:[{x:388,y:530},{x:414,y:474},{x:422,y:408},{x:412,y:344},{x:386,y:294},
         {x:344,y:264},{x:296,y:252}],
    uscita:{vx:-150, vy:300}, punti:1500 }
];

/* luci e borchie dipinte sul piano: danno densita' al tavolo */
var BORCHIE = [
  [150,196],[322,196],[124,232],[348,232],[236,110],
  [138,268],[334,268],[112,344],[356,332],[128,470],[352,462],
  [186,506],[286,506],[96,612],[376,606],[122,676],[350,672],
  [176,732],[296,732],[236,486],[236,760]
];
/* acini nelle corsie interne: si accendono al passaggio */
var ACINI = [
  {x:132,y:742,on:0},{x:138,y:772,on:0},{x:144,y:802,on:0},
  {x:340,y:742,on:0},{x:334,y:772,on:0},{x:328,y:802,on:0}
];

/* ══════════════════════════════════════════════════════════════════
   STATO
   ══════════════════════════════════════════════════════════════════ */

var G = {
  fase:"attesa",        // attesa | carica | gioco | fine
  punti:0, molt:1, tappi:3,
  record: parseInt(localStorage.getItem("vin_flipper_best") || "0", 10),
  carica:0, caricando:false,
  vinoFatti:0, salvagente:false, salvagenteUsato:false,
  rampeAccese:0, contoT:0, conto:null,
  tilt:false, spinte:0, spintaT:0, scossa:0, orbita:true,
  messaggi:[], lampo:0
};

var palle = [];
function nuovoTappo(x, y, vx, vy){
  return {x:x, y:y, vx:vx||0, vy:vy||0, r:11, rot:0, vivo:true,
          rampa:null, rampaT:0, rampaI:0, ultimaLuce:0, fermoT:0};
}

// varco fra le punte: 28 unita' contro 22 di tappo. Con 21 il tappo ci si
// incastrava sopra invece di cadere.
var alette = [
  {px:150, py:792, len:74, r:9, a:0, riposo: 32*Math.PI/180, su:-26*Math.PI/180, w:0, carica:0, giu:false, lato:"sx"},
  {px:322, py:792, len:74, r:9, a:0, riposo:(180-32)*Math.PI/180, su:(180+26)*Math.PI/180, w:0, carica:0, giu:false, lato:"dx"}
];
alette.forEach(function(f){ f.a = f.riposo; });

/* ══════════════════════════════════════════════════════════════════
   FISICA
   ══════════════════════════════════════════════════════════════════ */

var GRAV = 800;         // unita' al secondo quadrato
var SOTTOPASSI = 8;

function contattoSegmento(b, s){
  var dx = s.bx - s.ax, dy = s.by - s.ay;
  var L2 = dx*dx + dy*dy;
  var t = L2 > 0 ? ((b.x - s.ax)*dx + (b.y - s.ay)*dy) / L2 : 0;
  if(t < 0) t = 0; else if(t > 1) t = 1;
  var px = s.ax + t*dx, py = s.ay + t*dy;
  var nx = b.x - px, ny = b.y - py;
  var d = Math.sqrt(nx*nx + ny*ny);
  var raggio = b.r + (s.r || 0);
  if(d > raggio) return null;
  if(d < 0.0001){ nx = 0; ny = -1; d = 0.0001; }
  return {nx:nx/d, ny:ny/d, pen:raggio - d, px:px, py:py};
}

function contattoCerchio(b, c){
  var nx = b.x - c.x, ny = b.y - c.y;
  var d = Math.sqrt(nx*nx + ny*ny);
  var raggio = b.r + c.r;
  if(d > raggio) return null;
  if(d < 0.0001){ nx = 0; ny = -1; d = 0.0001; }
  return {nx:nx/d, ny:ny/d, pen:raggio - d, px:c.x + nx/d*c.r, py:c.y + ny/d*c.r};
}

function sbanda(k, quanto){
  // ruota di poco la normale: senza, ogni lancio fa lo stesso identico giro
  var a = (Math.random()*2 - 1) * quanto;
  var c = Math.cos(a), s2 = Math.sin(a);
  var nx = k.nx*c - k.ny*s2, ny = k.nx*s2 + k.ny*c;
  k.nx = nx; k.ny = ny;
  return k;
}

function rispondi(b, k, rimb, spinta){
  b.x += k.nx * k.pen;
  b.y += k.ny * k.pen;
  var vn = b.vx*k.nx + b.vy*k.ny;
  if(vn < 0){
    b.vx -= (1 + rimb) * vn * k.nx;
    b.vy -= (1 + rimb) * vn * k.ny;
  }
  if(spinta){ b.vx += k.nx * spinta; b.vy += k.ny * spinta; }
}

/* ══════════════════════════════════════════════════════════════════
   PUNTEGGIO E AVVISI
   ══════════════════════════════════════════════════════════════════ */

function segna(n){
  var m = G.molt * (G.conto ? 0.5 : 1);
  G.punti += Math.round(n * m);
  aggiornaPannello();
}
function avviso(testo){
  G.messaggi.push({t:testo, vita:1.9});
  if(G.messaggi.length > 3) G.messaggi.shift();
}
function aggiornaPannello(){
  // il punteggio ora si disegna nel cruscotto, non c'e' piu' niente in HTML
}


/* ══════════════════════════════════════════════════════════════════
   EVENTI DI GIOCO
   ══════════════════════════════════════════════════════════════════ */

function colpisciCalice(c, b){
  c.colpi++; c.flash = 1;
  segna(150);
  beep(520 + Math.random()*120, 0.07, "square", 0.05);
  if(c.colpi % 12 === 0){
    segna(2000);
    avviso("Calice pieno");
    beep(880, 0.2, "triangle", 0.07);
  }
}

function abbatti(t){
  if(t.giu) return;
  t.giu = true; t.flash = 1;
  segna(400);
  beep(660, 0.06, "square", 0.05);
  if(bersagli.every(function(x){ return x.giu; })){
    G.vinoFatti++;
    if(G.molt < 5){ G.molt++; }
    segna(3000);
    avviso("VINO, moltiplicatore x" + G.molt);
    beep(990, 0.25, "triangle", 0.08);
    if(G.vinoFatti >= 2 && !G.salvagente){
      G.salvagente = true;
      avviso("Salvagente acceso");
    }
    setTimeout(function(){ bersagli.forEach(function(x){ x.giu = false; }); }, 900);
  }
  aggiornaPannello();
}

function accendiLuceArco(l){
  if(l.on) return;
  l.on = true;
  segna(600);
  beep(740, 0.05, "sine", 0.04);
  var restano = luciArco.filter(function(x){ return !x.on; }).length;
  if(restano > 0) avviso(restano === 1 ? "Ancora un giro" : restano + " giri alla bottiglia");
  if(luciArco.every(function(x){ return x.on; })){
    G.rampeAccese = 20;
    segna(5000);
    avviso("Bottiglia aperta, rampe accese");
    beep(1180, 0.3, "triangle", 0.08);
    luciArco.forEach(function(x){ x.on = false; });
  }
  aggiornaPannello();
}

function accendiFetta(f){
  if(f.on) return;
  f.on = true;
  segna(200);
  beep(600 + Math.random()*200, 0.04, "sine", 0.035);
  if(fette.every(function(x){ return x.on; })){
    fette.forEach(function(x){ x.on = false; });
    segna(6000);
    avviso("Tagliere pieno, tre tappi");
    beep(1320, 0.35, "triangle", 0.09);
    for(var i = 0; i < 2; i++){
      palle.push(nuovoTappo(236 + (i?26:-26), 560, (i?110:-110), -240));
    }
    aggiornaPannello();
  }
}

function entraInRampa(b, r){
  b.rampa = r; b.rampaT = 0; b.rampaI = 0;
  var p = r.punti + (G.rampeAccese > 0 ? 8000 : 0);
  segna(p);
  avviso(G.rampeAccese > 0 ? "Jackpot, " + r.nome : "Rampa del " + r.nome);
  beep(G.rampeAccese > 0 ? 1240 : 820, 0.18, "triangle", 0.07);
}

function creaConto(){
  G.conto = {x:236, y:544, r:15, dir: Math.random() < 0.5 ? -1 : 1, vita:16};
  avviso("Arriva il conto");
  beep(180, 0.3, "sawtooth", 0.05);
  aggiornaPannello();
}
function togliConto(){
  G.conto = null; G.contoT = 26 + Math.random()*14;
  aggiornaPannello();
}

/* ══════════════════════════════════════════════════════════════════
   PASSO DI SIMULAZIONE
   ══════════════════════════════════════════════════════════════════ */

function passo(dt){
  // alette: vanno a velocita' costante verso la posizione voluta.
  // La "carica" resta viva ancora un attimo dopo che l'aletta e' arrivata su:
  // senza, la finestra utile e' 30 millesimi di secondo e nessuno la prende.
  alette.forEach(function(f){
    var meta = (f.giu && !G.tilt) ? f.su : f.riposo;
    var passoMax = 26 * dt;
    var d = meta - f.a;
    if(d > passoMax) d = passoMax; else if(d < -passoMax) d = -passoMax;
    f.w = d / dt;
    f.a += d;
    var salendo = (f.lato === "sx" ? d < -0.0005 : d > 0.0005);
    if(salendo) f.carica = 1;
    else if(f.carica > 0) f.carica -= dt / 0.13;
    if(f.carica < 0) f.carica = 0;
  });

  // il conto si muove
  if(G.conto){
    G.conto.x += G.conto.dir * 70 * dt;
    if(G.conto.x < 108){ G.conto.x = 108; G.conto.dir = 1; }
    if(G.conto.x > 364){ G.conto.x = 364; G.conto.dir = -1; }
    G.conto.vita -= dt;
    if(G.conto.vita <= 0) togliConto();
  } else if(G.fase === "gioco"){
    G.contoT -= dt;
    if(G.contoT <= 0) creaConto();
  }

  if(G.rampeAccese > 0){
    G.rampeAccese -= dt;
    if(G.rampeAccese <= 0){ G.rampeAccese = 0; aggiornaPannello(); }
  }

  for(var i = palle.length - 1; i >= 0; i--){
    var b = palle[i];

    // ── dentro una rampa: percorso guidato ──
    if(b.rampa){
      b.rampaT += dt * 1.7;
      var via = b.rampa.via;
      var pos = b.rampaT * (via.length - 1);
      var k = Math.floor(pos);
      if(k >= via.length - 1){
        var u = b.rampa.uscita;
        b.x = via[via.length-1].x; b.y = via[via.length-1].y;
        b.vx = u.vx; b.vy = u.vy;
        b.rampa = null;
      } else {
        var f2 = pos - k;
        b.x = via[k].x + (via[k+1].x - via[k].x) * f2;
        b.y = via[k].y + (via[k+1].y - via[k].y) * f2;
        b.rot += dt * 9;
      }
      continue;
    }

    // ── caricamento del lancio: il tappo sta fermo in fondo ──
    if(G.fase === "carica" && b.attesa){
      b.y = 828 - G.carica * 26;
      continue;
    }

    // ── moto ──
    b.vy += GRAV * dt;
    b.vx *= 0.99985; b.vy *= 0.99985;   // ~7% al secondo, prima era 29%
    if(G.scossa > 0){ b.vx += G.scossaX * dt * 60; }

    var vlen = Math.sqrt(b.vx*b.vx + b.vy*b.vy);
    if(vlen > 2300){ b.vx = b.vx/vlen*2300; b.vy = b.vy/vlen*2300; }

    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.rot += (b.vx * dt) / b.r;

    // ── muri ──
    for(var m = 0; m < muri.length; m++){
      var s = muri[m];
      var k1 = contattoSegmento(b, s);
      if(k1){
        if(s.tipo === "fionda"){
          rispondi(b, sbanda(k1, 0.14), 0.30, 300 + Math.random()*90);
          segna(75);
          beep(300, 0.05, "square", 0.04);
          fionde.forEach(function(fi){
            if(Math.abs((fi.ax+fi.bx+fi.cx)/3 - k1.px) < 90) fi.flash = 1;
          });
        } else {
          rispondi(b, k1, s.rimb, 0);
        }
      }
    }

    // ── paletti ──
    for(var p2 = 0; p2 < perni.length; p2++){
      var k2 = contattoCerchio(b, perni[p2]);
      if(k2) rispondi(b, sbanda(k2, perni[p2].tipo === "tagliere" ? 0.09 : 0.13), perni[p2].rimb, 0);
    }

    // ── calici ──
    for(var r2 = 0; r2 < respinte.length; r2++){
      var c2 = respinte[r2];
      var k3 = contattoCerchio(b, c2);
      if(k3){
        rispondi(b, sbanda(k3, 0.16), 0.42, 400 + Math.random()*90);
        colpisciCalice(c2, b);
      }
    }

    // ── bersagli V I N O ──
    for(var t2 = 0; t2 < bersagli.length; t2++){
      var tg = bersagli[t2];
      if(tg.giu) continue;
      var seg = {ax:tg.x - tg.w/2, ay:tg.y, bx:tg.x + tg.w/2, by:tg.y, r:tg.h/2};
      var k4 = contattoSegmento(b, seg);
      if(k4){ rispondi(b, k4, 0.34, 60); abbatti(tg); }
    }

    // ── alette ──
    for(var a2 = 0; a2 < alette.length; a2++){
      var f3 = alette[a2];
      var seg2 = {ax:f3.px, ay:f3.py,
                  bx:f3.px + Math.cos(f3.a)*f3.len, by:f3.py + Math.sin(f3.a)*f3.len, r:f3.r};
      var k5 = contattoSegmento(b, seg2);
      if(k5){
        var rx = k5.px - f3.px, ry = k5.py - f3.py;
        var vpx = -f3.w * ry, vpy = f3.w * rx;
        b.x += k5.nx * k5.pen; b.y += k5.ny * k5.pen;
        var rvx = b.vx - vpx, rvy = b.vy - vpy;
        var vn2 = rvx*k5.nx + rvy*k5.ny;
        if(vn2 < 0){
          var j = -(1 + 0.55) * vn2;
          b.vx += j * k5.nx; b.vy += j * k5.ny;
        }
        if(f3.carica > 0.02){
          var spinta = 900 * f3.carica;
          b.vx += k5.nx * spinta; b.vy += k5.ny * spinta;
          f3.carica = 0;
          beep(200, 0.05, "square", 0.05);
        }
      }
    }

    // ── il conto ──
    if(G.conto){
      var k6 = contattoCerchio(b, G.conto);
      if(k6){
        rispondi(b, k6, 0.5, 200);
        segna(2500);
        avviso("Conto pagato");
        beep(980, 0.2, "triangle", 0.07);
        togliConto();
      }
    }

    // ── luci e bocche delle rampe (zone, non collisioni) ──
    // un giro completo dell'arco accende UNA etichetta, non tutte:
    // passandoci sopra si prendevano tutte e cinque a ogni lancio
    if(b.y < ARCO.cy - ARCO.rIn + 24 && G.orbita){
      G.orbita = false;
      for(var l2 = 0; l2 < luciArco.length; l2++){
        if(!luciArco[l2].on){ accendiLuceArco(luciArco[l2]); break; }
      }
    }
    if(b.y > 340) G.orbita = true;
    for(var s2 = 0; s2 < fette.length; s2++){
      var F = fette[s2];
      if((b.x-F.x)*(b.x-F.x) + (b.y-F.y)*(b.y-F.y) < 210) accendiFetta(F);
    }
    for(var ac = 0; ac < ACINI.length; ac++){
      var A2 = ACINI[ac];
      if((b.x-A2.x)*(b.x-A2.x) + (b.y-A2.y)*(b.y-A2.y) < 220 && A2.on <= 0){
        A2.on = 1.6; segna(120); beep(820, 0.04, "sine", 0.03);
      }
    }
    for(var rr = 0; rr < RAMPE.length; rr++){
      var R = RAMPE[rr], bo = R.bocca;
      if((b.x-bo.x)*(b.x-bo.x) + (b.y-bo.y)*(b.y-bo.y) < bo.r*bo.r && b.vy < -60){
        entraInRampa(b, R); break;
      }
    }

    // ── corsie esterne: il salvagente ──
    if(b.y > 800 && b.y < 860 && (b.x < 96 || b.x > 424) && G.salvagente && !G.salvagenteUsato){
      G.salvagenteUsato = true; G.salvagente = false;
      b.vy = -880; b.vx = b.x < 260 ? 60 : -60;
      avviso("Salvagente");
      beep(1050, 0.22, "triangle", 0.07);
      aggiornaPannello();
    }

    // ── ricerca della pallina: se resta ferma da troppo, una scossa ──
    if(G.fase === "gioco" && !b.attesa){
      var vv = Math.hypot(b.vx, b.vy);
      if(vv < 26){ b.fermoT += dt; } else { b.fermoT = 0; }
      if(b.fermoT > 2.6){
        b.fermoT = 0;
        b.vx += (Math.random() < 0.5 ? -1 : 1) * (150 + Math.random()*120);
        b.vy -= 260;
        beep(140, 0.14, "sine", 0.045);
      }
    }

    // ── tornato nel canale di lancio: si rimette sul lanciatore, non e' perso ──
    if(b.x > 462 && b.y > 815 && Math.abs(b.vy) < 70 && G.fase === "gioco" && palle.length === 1){
      G.fase = "carica"; G.carica = 0; G.caricando = false;
      b.attesa = true; b.vx = 0; b.vy = 0; b.x = 480;
      document.getElementById("hint").textContent = "Il tappo è tornato indietro, rilancia.";
      continue;
    }

    // ── tappo perso ──
    if(b.y > H + 30){
      palle.splice(i, 1);
      if(palle.length === 0) tappoPerso();
    }
    // sicurezza: se per qualsiasi motivo esce di lato, lo riporto dentro
    if(b.x < -40 || b.x > W + 40){
      palle.splice(i, 1);
      if(palle.length === 0) tappoPerso();
    }
  }

  if(G.scossa > 0) G.scossa -= dt;
  if(G.spintaT > 0){ G.spintaT -= dt; if(G.spintaT <= 0) G.spinte = Math.max(0, G.spinte - 1); }
  G.messaggi.forEach(function(m){ m.vita -= dt; });
  G.messaggi = G.messaggi.filter(function(m){ return m.vita > 0; });
  ACINI.forEach(function(a){ if(a.on > 0) a.on -= dt; });
  respinte.forEach(function(c){ if(c.flash > 0) c.flash -= dt*3; });
  fionde.forEach(function(f){ if(f.flash > 0) f.flash -= dt*4; });
  bersagli.forEach(function(t){ if(t.flash > 0) t.flash -= dt*3; });
}

function tappoPerso(){
  G.tilt = false; G.spinte = 0;
  G.tappi--;
  aggiornaPannello();
  if(G.tappi <= 0){ finePartita(); return; }
  beep(200, 0.3, "sine", 0.05);
  setTimeout(preparaLancio, 700);
}

function preparaLancio(){
  G.fase = "carica"; G.carica = 0; G.caricando = false;
  G.salvagenteUsato = false;
  var b = nuovoTappo(480, 828, 0, 0);
  b.attesa = true;
  palle = [b];
  document.getElementById("hint").textContent = "Tieni premuto in basso, poi molla per lanciare.";
}

function lancia(){
  if(G.fase !== "carica") return;
  var b = palle[0];
  if(!b) return;
  b.attesa = false;
  b.vy = -(640 + G.carica * 1060) * (0.985 + Math.random()*0.03);
  b.vx = 0;
  G.fase = "gioco";
  G.carica = 0;
  beep(320, 0.16, "sawtooth", 0.06);
  document.getElementById("hint").textContent = "Metà schermo, o frecce, per le alette.";
}

function finePartita(){
  G.fase = "fine";
  if(G.punti > G.record){
    G.record = G.punti;
    localStorage.setItem("vin_flipper_best", String(G.record));
  }
  document.getElementById("finale").textContent = G.punti.toLocaleString("it-IT");
  var msg = G.punti >= G.record && G.punti > 0
    ? "Record nuovo. Il tagliere è tuo."
    : "Il conto vince ancora. Ci vuole un altro giro.";
  document.getElementById("messaggio").textContent = msg;
  document.getElementById("endOverlay").classList.remove("hide");
  aggiornaPannello();
}

function nuovaPartita(){
  G.punti = 0; G.molt = 1; G.tappi = 3;
  G.vinoFatti = 0; G.salvagente = false; G.salvagenteUsato = false;
  G.rampeAccese = 0; G.conto = null; G.contoT = 22;
  G.tilt = false; G.spinte = 0; G.messaggi = []; G.orbita = true;
  costruisciTavolo();
  document.getElementById("overlay").classList.add("hide");
  document.getElementById("endOverlay").classList.add("hide");
  preparaLancio();
  aggiornaPannello();
}

/* ══════════════════════════════════════════════════════════════════
   DISEGNO
   Una sola regola: la luce viene da sopra a sinistra. Ogni oggetto ha
   la sua ombra dalla stessa parte, un bordo scuro che lo stacca dal
   piano e una luce sul lato illuminato. E' quello che fa sembrare le
   cose appoggiate sul tavolo invece che stampate sopra.
   ══════════════════════════════════════════════════════════════════ */

var LUX = {x:-0.44, y:-0.62};
var BORDO = "rgba(16,6,11,.72)";

function ombra(dx, dy, sfoca, alfa, fn){
  cx.save();
  cx.shadowColor = "rgba(6,2,5," + alfa + ")";
  cx.shadowBlur = sfoca; cx.shadowOffsetX = dx; cx.shadowOffsetY = dy;
  fn();
  cx.restore();
}
function sfera(x, y, r, chiaro, scuro){
  var g = cx.createRadialGradient(x + LUX.x*r*0.5, y + LUX.y*r*0.5, r*0.06, x, y, r*1.02);
  g.addColorStop(0, chiaro); g.addColorStop(1, scuro);
  return g;
}
function grad(x0,y0,x1,y1,a,b){
  var g = cx.createLinearGradient(x0,y0,x1,y1);
  g.addColorStop(0,a); g.addColorStop(1,b); return g;
}
function contorno(w, col){ cx.strokeStyle = col || BORDO; cx.lineWidth = w || 1.7; cx.stroke(); }

/* ── la cassa ───────────────────────────────────────────────────── */
function disegnaCassa(){
  cx.fillStyle = C.cassa;
  cx.fillRect(0, 0, W, H);
  var g = cx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, C.cassaLuce); g.addColorStop(0.5, C.cassa); g.addColorStop(1, C.cassaLuce);
  cx.fillStyle = g;
  cx.fillRect(0, 0, W, H);
}

/* ── il piano di gioco ──────────────────────────────────────────── */
function disegnaPiano(){
  cx.save();
  cx.beginPath(); cx.rect(10, 10, W-20, H-20); cx.clip();

  var g = cx.createRadialGradient(200, 260, 40, 260, 640, 660);
  g.addColorStop(0, "#5b2340");
  g.addColorStop(0.42, C.fondo);
  g.addColorStop(1, "#1c0a14");
  cx.fillStyle = g;
  cx.fillRect(10, 10, W-20, H-20);

  // legno sotto la vernice
  cx.strokeStyle = "rgba(190,107,52,.075)"; cx.lineWidth = 1.5;
  for(var i = 0; i < 24; i++){
    var y0 = 16 + i*38;
    cx.beginPath(); cx.moveTo(10, y0);
    for(var x = 10; x <= W-10; x += 24){
      cx.lineTo(x, y0 + Math.sin((x + i*61)*0.02)*6 + Math.sin(x*0.007 + i)*3);
    }
    cx.stroke();
  }

  // la tovaglietta di carta sotto il tagliere
  cx.save();
  cx.translate(236, 636); cx.rotate(-0.055);
  cx.fillStyle = "rgba(230,220,196,.085)";
  cx.fillRect(-172, -150, 344, 292);
  cx.strokeStyle = "rgba(230,220,196,.16)"; cx.lineWidth = 1;
  cx.strokeRect(-172, -150, 344, 292);
  cx.setLineDash([5,6]);
  cx.strokeStyle = "rgba(230,220,196,.12)";
  cx.strokeRect(-162, -140, 324, 272);
  cx.setLineDash([]);
  cx.restore();

  // gli anelli che lascia il bicchiere sulla tavola
  [[92,236,30],[404,214,26],[128,596,34],[368,568,28],[210,760,24],[300,700,30],[60,700,22]]
   .forEach(function(a){
    cx.save();
    cx.strokeStyle = "rgba(141,51,85,.20)"; cx.lineWidth = 3.2;
    cx.beginPath(); cx.arc(a[0], a[1], a[2], 0, Math.PI*2); cx.stroke();
    cx.strokeStyle = "rgba(232,178,74,.07)"; cx.lineWidth = 1.2;
    cx.beginPath(); cx.arc(a[0], a[1], a[2]-3.4, 0, Math.PI*2); cx.stroke();
    cx.restore();
  });

  // tralcio dipinto, in basso
  cx.save();
  cx.strokeStyle = "rgba(47,107,70,.20)"; cx.lineWidth = 2.4; cx.lineCap = "round";
  cx.beginPath();
  cx.moveTo(56, 812); cx.bezierCurveTo(130, 764, 190, 806, 236, 776);
  cx.bezierCurveTo(286, 806, 344, 764, 420, 812);
  cx.stroke();
  cx.fillStyle = "rgba(88,35,60,.24)";
  [[96,790],[150,788],[204,790],[268,790],[322,788],[380,792]].forEach(function(p){
    for(var k = 0; k < 3; k++){
      cx.beginPath(); cx.arc(p[0] + (k-1)*6, p[1] + (k===1?6:0), 4.2, 0, Math.PI*2); cx.fill();
    }
  });
  cx.restore();

  cx.restore();
}

/* ── i canali di legno ──────────────────────────────────────────── */
function disegnaCanali(){
  cx.save();
  cx.beginPath();
  cx.arc(ARCO.cx, ARCO.cy, (ARCO.rOut+ARCO.rIn)/2, Math.PI, Math.PI*2);
  cx.lineWidth = ARCO.rOut - ARCO.rIn;
  cx.strokeStyle = grad(16,300,504,300,"#3a2116","#5d3922");
  cx.stroke();
  // doghe
  cx.lineWidth = 1;
  cx.strokeStyle = "rgba(16,8,4,.4)";
  for(var g = 182; g < 360; g += 8){
    var t = g*Math.PI/180;
    cx.beginPath();
    cx.moveTo(ARCO.cx + Math.cos(t)*ARCO.rIn, ARCO.cy + Math.sin(t)*ARCO.rIn);
    cx.lineTo(ARCO.cx + Math.cos(t)*ARCO.rOut, ARCO.cy + Math.sin(t)*ARCO.rOut);
    cx.stroke();
  }
  // ombra interna del canale, dalla parte della luce
  cx.lineWidth = 9;
  cx.strokeStyle = "rgba(0,0,0,.28)";
  cx.beginPath(); cx.arc(ARCO.cx, ARCO.cy, ARCO.rOut - 5, Math.PI, Math.PI*2); cx.stroke();
  cx.strokeStyle = "rgba(255,220,170,.09)";
  cx.beginPath(); cx.arc(ARCO.cx, ARCO.cy, ARCO.rIn + 5, Math.PI, Math.PI*2); cx.stroke();
  cx.restore();

  // canale di lancio
  cx.fillStyle = grad(456,300,504,300,"#3a2116","#5d3922");
  cx.fillRect(456, 300, 48, 556);
  cx.fillStyle = "rgba(16,8,4,.32)";
  for(var y = 306; y < 856; y += 8){ cx.fillRect(456, y, 48, 1); }
  cx.fillStyle = "rgba(0,0,0,.26)"; cx.fillRect(456, 300, 7, 556);
  cx.fillStyle = "rgba(255,220,170,.08)"; cx.fillRect(497, 300, 7, 556);

  // canale sinistro
  cx.fillStyle = grad(16,300,64,300,"#5d3922","#3a2116");
  cx.fillRect(16, 300, 48, 132);
  cx.fillStyle = "rgba(16,8,4,.32)";
  for(var y2 = 306; y2 < 432; y2 += 8){ cx.fillRect(16, y2, 48, 1); }
}

/* ── guide di metallo ───────────────────────────────────────────── */
function rail(ax, ay, bx, by, w){
  w = w || 5;
  cx.save(); cx.lineCap = "round";
  cx.strokeStyle = "rgba(6,2,5,.55)"; cx.lineWidth = w + 3;
  cx.beginPath(); cx.moveTo(ax, ay+3); cx.lineTo(bx, by+3); cx.stroke();
  cx.strokeStyle = "#6f6555"; cx.lineWidth = w;
  cx.beginPath(); cx.moveTo(ax, ay); cx.lineTo(bx, by); cx.stroke();
  cx.strokeStyle = "#e6ddcc"; cx.lineWidth = Math.max(1.4, w*0.42);
  cx.beginPath(); cx.moveTo(ax, ay - w*0.22); cx.lineTo(bx, by - w*0.22); cx.stroke();
  cx.restore();
}
function railArco(ccx, ccy, rad, da, a, w){
  w = w || 5;
  cx.save(); cx.lineCap = "round";
  cx.strokeStyle = "rgba(6,2,5,.55)"; cx.lineWidth = w + 3;
  cx.beginPath(); cx.arc(ccx, ccy+3, rad, da*Math.PI/180, a*Math.PI/180); cx.stroke();
  cx.strokeStyle = "#6f6555"; cx.lineWidth = w;
  cx.beginPath(); cx.arc(ccx, ccy, rad, da*Math.PI/180, a*Math.PI/180); cx.stroke();
  cx.strokeStyle = "#e6ddcc"; cx.lineWidth = Math.max(1.4, w*0.42);
  cx.beginPath(); cx.arc(ccx, ccy - w*0.22, rad, da*Math.PI/180, a*Math.PI/180); cx.stroke();
  cx.restore();
}

/* ── il tagliere ────────────────────────────────────────────────── */
var SALUMI = ["#b8556b","#d98a86","#c9a24a","#a8455c","#e0c07a","#b8556b","#d98a86","#c9a24a"];
function disegnaTagliere(){
  cx.save();
  cx.translate(236, 626);

  // incassato nel piano: il tappo ci rotola sopra, quindi niente spessore.
  // Un solco scuro tutt'intorno e l'ombra INTERNA dalla parte della luce.
  cx.fillStyle = "rgba(8,3,6,.55)";
  cx.beginPath(); cx.arc(0, 0, 82, 0, Math.PI*2); cx.fill();

  var g = cx.createRadialGradient(-26, -30, 8, 0, 0, 90);
  g.addColorStop(0, "#8a5730"); g.addColorStop(0.68, C.legno); g.addColorStop(1, "#40240f");
  cx.fillStyle = g;
  cx.beginPath(); cx.arc(0, 0, 78, 0, Math.PI*2); cx.fill();

  cx.save();
  cx.beginPath(); cx.arc(0, 0, 78, 0, Math.PI*2); cx.clip();
  cx.strokeStyle = "rgba(58,32,14,.45)"; cx.lineWidth = 1.4;
  for(var i = -4; i <= 4; i++){
    cx.beginPath(); cx.arc(-150 + i*9, 0, 160, -0.5, 0.5); cx.stroke();
  }
  cx.restore();

  // ombra interna in alto a sinistra e luce in basso a destra: cosi' il
  // tagliere sembra scavato dentro il piano invece che appoggiato sopra
  cx.save();
  cx.beginPath(); cx.arc(0, 0, 78, 0, Math.PI*2); cx.clip();
  cx.strokeStyle = "rgba(6,2,5,.45)"; cx.lineWidth = 7;
  cx.beginPath(); cx.arc(0, 0, 76, Math.PI*0.95, Math.PI*1.85); cx.stroke();
  cx.strokeStyle = "rgba(255,232,196,.14)"; cx.lineWidth = 5;
  cx.beginPath(); cx.arc(0, 0, 76, Math.PI*0.02, Math.PI*0.82); cx.stroke();
  cx.restore();
  cx.beginPath(); cx.arc(0, 0, 78, 0, Math.PI*2); contorno(2);

  // le fette, che compaiono davvero sul tagliere
  fette.forEach(function(f, i){
    var a = f.ang, x = Math.cos(a)*100, y = Math.sin(a)*100;
    cx.save();
    cx.translate(x, y); cx.rotate(a + Math.PI/2);
    if(f.on){
      ombra(1.5, 2.5, 4, 0.55, function(){
        cx.fillStyle = SALUMI[i % SALUMI.length];
        cx.beginPath(); cx.ellipse(0, 0, 8.5, 6, 0, 0, Math.PI*2); cx.fill();
      });
      cx.fillStyle = "rgba(255,255,255,.28)";
      cx.beginPath(); cx.ellipse(-2.4, -1.8, 3, 1.9, -0.5, 0, Math.PI*2); cx.fill();
      cx.beginPath(); cx.ellipse(0, 0, 8.5, 6, 0, 0, Math.PI*2); contorno(1.2, "rgba(40,14,22,.6)");
    } else {
      cx.fillStyle = "rgba(20,8,12,.42)";
      cx.beginPath(); cx.ellipse(0, 0, 7, 4.8, 0, 0, Math.PI*2); cx.fill();
      cx.strokeStyle = "rgba(244,237,226,.26)"; cx.lineWidth = 1;
      cx.beginPath(); cx.ellipse(0, 0, 7, 4.8, 0, 0, Math.PI*2); cx.stroke();
    }
    cx.restore();
  });

  var n = fette.filter(function(f){ return f.on; }).length;

  // alone caldo quando il tagliere si riempie
  if(n > 0){
    var ag = cx.createRadialGradient(0, 0, 40, 0, 0, 104);
    ag.addColorStop(0, "rgba(232,178,74,0)");
    ag.addColorStop(1, "rgba(232,178,74," + (0.05 + n/16*0.22) + ")");
    cx.fillStyle = ag;
    cx.beginPath(); cx.arc(0, 0, 104, 0, Math.PI*2); cx.fill();
  }

  cx.textAlign = "center"; cx.textBaseline = "middle";
  cx.fillStyle = "rgba(24,10,6,.5)";
  cx.font = "italic 15px Georgia, serif";
  cx.fillText("tagliere", 0, -13);
  cx.fillStyle = "rgba(246,232,206,.6)";
  cx.fillText("tagliere", 0, -14);
  cx.fillStyle = "rgba(20,8,12,.42)";
  cx.beginPath();
  if(cx.roundRect) cx.roundRect(-33, 2, 66, 26, 13); else cx.rect(-33, 2, 66, 26);
  cx.fill();
  cx.strokeStyle = n === 16 ? C.oro : "rgba(246,232,206,.3)"; cx.lineWidth = 1.4; cx.stroke();
  cx.font = "700 19px Georgia, serif";
  cx.fillStyle = n === 16 ? C.oroChiaro : "rgba(246,232,206,.8)";
  cx.fillText(n + " / 16", 0, 16);
  cx.restore();
}

/* ── le rampe, con il pianale di plastica ───────────────────────── */
function bordoRampa(via, d){
  var pts = [];
  for(var i = 0; i < via.length; i++){
    var a = via[Math.max(0, i-1)], b = via[Math.min(via.length-1, i+1)];
    var dx = b.x-a.x, dy = b.y-a.y, L = Math.hypot(dx,dy) || 1;
    pts.push({x:via[i].x - dy/L*d, y:via[i].y + dx/L*d});
  }
  return pts;
}
function tracciato(pts){
  cx.beginPath();
  cx.moveTo(pts[0].x, pts[0].y);
  for(var i = 1; i < pts.length; i++) cx.lineTo(pts[i].x, pts[i].y);
}
function pianale(A, B){
  cx.beginPath();
  cx.moveTo(A[0].x, A[0].y);
  for(var i = 1; i < A.length; i++) cx.lineTo(A[i].x, A[i].y);
  for(var j = B.length-1; j >= 0; j--) cx.lineTo(B[j].x, B[j].y);
  cx.closePath();
}

function disegnaRampe(){
  var acc = G.rampeAccese > 0;
  RAMPE.forEach(function(R){
    var via = R.via;
    var A = bordoRampa(via, 10), B = bordoRampa(via, -10);
    cx.save();
    cx.lineCap = "round"; cx.lineJoin = "round";

    // ombra portata sul piano
    cx.save(); cx.translate(5, 9);
    cx.fillStyle = "rgba(6,2,5,.45)";
    pianale(A, B); cx.fill();
    cx.restore();

    // il pianale di plastica colorata
    pianale(A, B);
    var g;
    if(R.nome === "cavatappi"){
      g = cx.createLinearGradient(40, 560, 220, 240);
      g.addColorStop(0, acc ? "rgba(244,208,138,.92)" : "rgba(46,126,119,.82)");
      g.addColorStop(1, acc ? "rgba(232,178,74,.86)" : "rgba(24,84,80,.86)");
    } else {
      g = cx.createLinearGradient(440, 540, 280, 240);
      g.addColorStop(0, acc ? "rgba(244,208,138,.92)" : "rgba(207,120,58,.86)");
      g.addColorStop(1, acc ? "rgba(232,178,74,.86)" : "rgba(150,66,30,.88)");
    }
    cx.fillStyle = g; cx.fill();
    contorno(2.2);

    // luce sul bordo alto
    cx.strokeStyle = "rgba(255,245,225,.4)"; cx.lineWidth = 2;
    tracciato(A); cx.stroke();
    cx.strokeStyle = "rgba(0,0,0,.3)"; cx.lineWidth = 2;
    tracciato(B); cx.stroke();

    // le traversine stampate
    cx.strokeStyle = acc ? "rgba(90,40,10,.5)" : "rgba(255,246,230,.28)";
    cx.lineWidth = 2.4;
    for(var k = 0; k < via.length-1; k++){
      for(var q = 0.25; q < 1; q += 0.5){
        var ax = A[k].x + (A[k+1].x-A[k].x)*q, ay = A[k].y + (A[k+1].y-A[k].y)*q;
        var bx = B[k].x + (B[k+1].x-B[k].x)*q, by = B[k].y + (B[k+1].y-B[k].y)*q;
        cx.beginPath(); cx.moveTo(ax, ay); cx.lineTo(bx, by); cx.stroke();
      }
    }

    // le sponde di filo, sopra al pianale
    cx.strokeStyle = "rgba(6,2,5,.45)"; cx.lineWidth = 6;
    cx.save(); cx.translate(1.5, 3); tracciato(A); cx.stroke(); tracciato(B); cx.stroke(); cx.restore();
    cx.strokeStyle = "#6f6555"; cx.lineWidth = 4.2;
    tracciato(A); cx.stroke(); tracciato(B); cx.stroke();
    cx.strokeStyle = "#e6ddcc"; cx.lineWidth = 1.8;
    tracciato(A); cx.stroke(); tracciato(B); cx.stroke();
    cx.restore();

    // la bocca
    var bo = R.bocca;
    cx.save();
    cx.translate(bo.x, bo.y);
    ombra(2, 5, 8, 0.6, function(){
      cx.fillStyle = "#150810";
      cx.beginPath(); cx.arc(0, 0, bo.r, 0, Math.PI*2); cx.fill();
    });
    var gb = cx.createRadialGradient(0, -3, 2, 0, 0, bo.r);
    gb.addColorStop(0, "#0a0409"); gb.addColorStop(1, "#2a1520");
    cx.fillStyle = gb;
    cx.beginPath(); cx.arc(0, 0, bo.r, 0, Math.PI*2); cx.fill();
    if(acc){ cx.shadowColor = C.oro; cx.shadowBlur = 20; }
    cx.strokeStyle = acc ? C.oro : "#cfc4b1"; cx.lineWidth = 3.4;
    cx.beginPath(); cx.arc(0, 0, bo.r, 0, Math.PI*2); cx.stroke();
    cx.shadowBlur = 0;
    cx.strokeStyle = "rgba(255,250,240,.55)"; cx.lineWidth = 1.4;
    cx.beginPath(); cx.arc(0, -1.4, bo.r, Math.PI*1.08, Math.PI*1.85); cx.stroke();
    // freccia
    cx.fillStyle = acc ? C.oroChiaro : "rgba(230,221,204,.72)";
    cx.beginPath(); cx.moveTo(0, -9); cx.lineTo(6.5, 3.5); cx.lineTo(-6.5, 3.5); cx.closePath(); cx.fill();
    cx.fillStyle = acc ? C.oro : "rgba(230,221,204,.6)";
    cx.font = "700 8px -apple-system, Helvetica, sans-serif";
    cx.textAlign = "center"; cx.textBaseline = "middle";
    cx.fillText(acc ? "JACKPOT" : R.nome.toUpperCase(), 0, bo.r + 11);
    cx.restore();
  });
}

/* ── i calici: paraurti a fungo ─────────────────────────────────── */
function disegnaCalici(){
  respinte.forEach(function(c){
    var f = Math.max(0, c.flash);
    var q = (c.colpi % 12) / 12;
    var r = c.r;
    cx.save();
    cx.translate(c.x, c.y);

    // ombra a terra
    cx.fillStyle = "rgba(6,2,5,.5)";
    cx.beginPath(); cx.ellipse(3.5, 8, r+2, r-1, 0, 0, Math.PI*2); cx.fill();

    // gonna: il piede del calice
    cx.fillStyle = sfera(0, 0, r+2, "#efe6d6", "#7d7263");
    cx.beginPath(); cx.arc(0, 2, r+2, 0, Math.PI*2); cx.fill();
    cx.beginPath(); cx.arc(0, 2, r+2, 0, Math.PI*2); contorno(1.8);

    // ghiera di metallo
    if(f > 0){ cx.shadowColor = C.oro; cx.shadowBlur = 26*f; }
    cx.strokeStyle = grad(-r,-r,r,r,"#f6e6bd","#96762f"); cx.lineWidth = 5;
    cx.beginPath(); cx.arc(0, 0, r-2, 0, Math.PI*2); cx.stroke();
    cx.shadowBlur = 0;
    cx.strokeStyle = "rgba(255,250,235,.7)"; cx.lineWidth = 1.6;
    cx.beginPath(); cx.arc(0, -1, r-2, Math.PI*1.02, Math.PI*1.8); cx.stroke();

    // la cupola: il vino visto dall'alto
    var rin = r - 6;
    cx.fillStyle = sfera(0, 0, rin, f > 0 ? "#e0668f" : "#a8436a", "#33101f");
    cx.beginPath(); cx.arc(0, 0, rin, 0, Math.PI*2); cx.fill();

    // livello che sale
    if(q > 0){
      cx.save();
      cx.beginPath(); cx.arc(0, 0, rin, 0, Math.PI*2); cx.clip();
      cx.fillStyle = "rgba(232,178,74,.26)";
      cx.fillRect(-rin, rin - 2*rin*q, rin*2, rin*2);
      cx.restore();
    }

    // luce dentro il vetro
    cx.fillStyle = "rgba(255,255,255,.42)";
    cx.beginPath(); cx.ellipse(-rin*0.36, -rin*0.42, rin*0.3, rin*0.15, -0.6, 0, Math.PI*2); cx.fill();
    cx.fillStyle = "rgba(255,255,255,.16)";
    cx.beginPath(); cx.ellipse(rin*0.3, rin*0.35, rin*0.22, rin*0.1, -0.5, 0, Math.PI*2); cx.fill();

    cx.beginPath(); cx.arc(0, 0, rin, 0, Math.PI*2); contorno(1.4);
    cx.restore();
  });
}

/* ── gli spicchi: fionda con elastico sopra ─────────────────────── */
function disegnaFionde(){
  fionde.forEach(function(f){
    var fl = Math.max(0, f.flash);
    cx.save();

    // plastica sagomata, con lo spessore
    ombra(3, 7, 8, 0.55, function(){
      cx.beginPath();
      cx.moveTo(f.ax, f.ay); cx.lineTo(f.bx, f.by); cx.lineTo(f.cx, f.cy); cx.closePath();
      cx.fillStyle = "#2a1a08"; cx.fill();
    });
    cx.beginPath();
    cx.moveTo(f.ax, f.ay+4); cx.lineTo(f.bx, f.by+4); cx.lineTo(f.cx, f.cy+4); cx.closePath();
    cx.fillStyle = "#8a6a20"; cx.fill();

    cx.beginPath();
    cx.moveTo(f.ax, f.ay); cx.lineTo(f.bx, f.by); cx.lineTo(f.cx, f.cy); cx.closePath();
    var g = cx.createLinearGradient(f.ax, f.ay, f.cx, f.cy);
    g.addColorStop(0, "#f6e3a0"); g.addColorStop(0.5, "#e8c96a"); g.addColorStop(1, "#c9a53f");
    cx.fillStyle = g; cx.fill();

    // i buchi del formaggio, con l'ombra dentro
    var mx = (f.ax+f.bx+f.cx)/3, my = (f.ay+f.by+f.cy)/3, sx = (f.lato === "sx" ? 1 : -1);
    [[0,-15,4.4],[9,5,3.2],[-9,9,3.6],[3,20,2.6],[-4,-4,2.2]].forEach(function(o){
      var ox = mx + o[0]*sx, oy = my + o[1];
      cx.fillStyle = "rgba(120,88,22,.55)";
      cx.beginPath(); cx.arc(ox, oy, o[2], 0, Math.PI*2); cx.fill();
      cx.fillStyle = "rgba(255,244,200,.5)";
      cx.beginPath(); cx.arc(ox - o[2]*0.3, oy - o[2]*0.35, o[2]*0.55, 0, Math.PI*2); cx.fill();
    });

    cx.beginPath();
    cx.moveTo(f.ax, f.ay); cx.lineTo(f.bx, f.by); cx.lineTo(f.cx, f.cy); cx.closePath();
    contorno(1.8);

    // i due paletti e l'elastico che colpisce
    [[f.ax, f.ay],[f.cx, f.cy]].forEach(function(p){
      cx.fillStyle = "rgba(6,2,5,.5)";
      cx.beginPath(); cx.arc(p[0]+1.5, p[1]+3, 6, 0, Math.PI*2); cx.fill();
      cx.fillStyle = sfera(p[0], p[1], 6, "#f4ecdb", "#7f7568");
      cx.beginPath(); cx.arc(p[0], p[1], 6, 0, Math.PI*2); cx.fill();
      cx.beginPath(); cx.arc(p[0], p[1], 6, 0, Math.PI*2); contorno(1.3);
    });
    if(fl > 0){ cx.shadowColor = C.oroChiaro; cx.shadowBlur = 20*fl; }
    cx.strokeStyle = fl > 0 ? "#ffe9b4" : "#8d3355";
    cx.lineWidth = fl > 0 ? 6 : 4.6; cx.lineCap = "round";
    cx.beginPath(); cx.moveTo(f.ax, f.ay); cx.lineTo(f.bx, f.by); cx.stroke();
    cx.shadowBlur = 0;
    cx.strokeStyle = "rgba(255,240,225,.35)"; cx.lineWidth = 1.4;
    cx.beginPath(); cx.moveTo(f.ax, f.ay-1.4); cx.lineTo(f.bx, f.by-1.4); cx.stroke();
    cx.restore();
  });
}

/* ── il bancone: corsie e etichette ─────────────────────────────── */
function disegnaLuciArco(){
  var rr = (ARCO.rOut + ARCO.rIn) / 2;
  var tinte = ["#e8b24a","#be6b34","#2f6b46","#8d3355","#2e7e77"];
  cx.save();
  cx.lineCap = "butt";
  for(var g2 = 188; g2 < 358; g2 += 6){
    var t1 = g2*Math.PI/180;
    cx.globalAlpha = 0.5;
    cx.strokeStyle = tinte[(g2/6|0) % tinte.length];
    cx.lineWidth = 9;
    cx.beginPath();
    cx.moveTo(ARCO.cx + Math.cos(t1)*(ARCO.rIn + 8), ARCO.cy + Math.sin(t1)*(ARCO.rIn + 8));
    cx.lineTo(ARCO.cx + Math.cos(t1)*(ARCO.rOut - 8), ARCO.cy + Math.sin(t1)*(ARCO.rOut - 8));
    cx.stroke();
  }
  cx.restore();

  luciArco.forEach(function(L){
    cx.save();
    cx.translate(L.x, L.y);
    cx.rotate(L.ang + Math.PI/2);
    ombra(2, 4, 6, 0.55, function(){
      cx.fillStyle = "#1b0d14";
      cx.fillRect(-9, -13, 18, 26);
    });
    if(L.on){ cx.shadowColor = C.oro; cx.shadowBlur = 18; }
    cx.fillStyle = L.on ? grad(0,-13,0,13,"#fff0c8","#e0a93c") : grad(0,-13,0,13,"#584250","#33202c");
    cx.fillRect(-9, -13, 18, 26);
    cx.shadowBlur = 0;
    // la bottiglia stampata
    cx.fillStyle = L.on ? "rgba(88,35,60,.85)" : "rgba(244,237,226,.28)";
    cx.fillRect(-2.4, -10, 4.8, 8);
    cx.fillRect(-5.5, -3, 11, 11);
    cx.fillStyle = L.on ? "rgba(255,247,225,.85)" : "rgba(244,237,226,.2)";
    cx.fillRect(-5.5, 1, 11, 3.4);
    cx.beginPath(); cx.rect(-9, -13, 18, 26); contorno(1.4);
    cx.restore();
  });
}

/* ── il conto ───────────────────────────────────────────────────── */

/* ── le alette ──────────────────────────────────────────────────── */
function disegnaAlette(){
  alette.forEach(function(f){
    var tipx = f.px + Math.cos(f.a)*f.len, tipy = f.py + Math.sin(f.a)*f.len;
    cx.save();
    cx.translate(f.px, f.py);
    cx.rotate(f.a);
    var L = f.len, r1 = 12, r2 = 7.5;

    function sagoma(o){
      cx.beginPath();
      cx.arc(0, 0, r1 + o, Math.PI/2, -Math.PI/2, true);
      cx.lineTo(L, -r2 - o);
      cx.arc(L, 0, r2 + o, -Math.PI/2, Math.PI/2, true);
      cx.closePath();
    }
    // ombra
    cx.save(); cx.translate(2, 5);
    cx.fillStyle = "rgba(6,2,5,.55)"; sagoma(1); cx.fill();
    cx.restore();

    // corpo
    var g = cx.createLinearGradient(0, -r1, 0, r1);
    g.addColorStop(0, "#c95a86"); g.addColorStop(0.42, "#8d3355"); g.addColorStop(1, "#4a1a30");
    cx.fillStyle = g; sagoma(0); cx.fill();

/* ── il tappo di sughero ────────────────────────────────────────── */
function disegnaTappo(b){
  cx.save();
  // ombra a terra, staccata
  cx.fillStyle = "rgba(6,2,5,.5)";
  cx.beginPath(); cx.ellipse(b.x + 4, b.y + 7, b.r*0.95, b.r*0.8, 0, 0, Math.PI*2); cx.fill();

  cx.translate(b.x, b.y);
  cx.rotate(b.rot);
  cx.fillStyle = sfera(0, 0, b.r, "#f0d49a", "#8c5c26");
  cx.beginPath(); cx.arc(0, 0, b.r, 0, Math.PI*2); cx.fill();
  // grana
  cx.fillStyle = "rgba(112,72,28,.42)";
  for(var i = 0; i < 9; i++){
    var a = i*1.7, rr = 1.8 + (i%4)*2.1;
    cx.beginPath(); cx.arc(Math.cos(a)*rr, Math.sin(a)*rr, 0.95, 0, Math.PI*2); cx.fill();
  }
  // la V
  cx.strokeStyle = "rgba(76,28,50,.8)"; cx.lineWidth = 1.8; cx.lineCap = "round";
  cx.beginPath(); cx.moveTo(-3.8, -3.4); cx.lineTo(0, 3.6); cx.lineTo(3.8, -3.4); cx.stroke();
  cx.beginPath(); cx.arc(0, 0, b.r, 0, Math.PI*2); contorno(1.3);
  cx.restore();

  // riflesso fisso, non gira col tappo
  cx.fillStyle = "rgba(255,252,244,.55)";
  cx.beginPath(); cx.ellipse(b.x - b.r*0.36, b.y - b.r*0.42, b.r*0.3, b.r*0.19, -0.6, 0, Math.PI*2); cx.fill();
}

}



/* ── inserti: le placchette traslucide incassate nel piano che si accendono.
      Sono la firma di un flipper vero, prima non c'erano. ───────────────── */
function inserto(x, y, w, h, acceso, tinta, testo, forma){
  cx.save();
  cx.translate(x, y);
  function sagoma(o){
    o = o || 0;
    cx.beginPath();
    if(forma === "freccia"){
      cx.moveTo(0, -h/2 - o);
      cx.lineTo(w/2 + o, 0);
      cx.lineTo(w/4 + o/2, 0);
      cx.lineTo(w/4 + o/2, h/2 + o);
      cx.lineTo(-w/4 - o/2, h/2 + o);
      cx.lineTo(-w/4 - o/2, 0);
      cx.lineTo(-w/2 - o, 0);
      cx.closePath();
    } else if(forma === "tondo"){
      cx.arc(0, 0, w/2 + o, 0, Math.PI*2);
    } else {
      var r = Math.min(h/2 + o, 7);
      if(cx.roundRect) cx.roundRect(-w/2 - o, -h/2 - o, w + 2*o, h + 2*o, r);
      else cx.rect(-w/2 - o, -h/2 - o, w + 2*o, h + 2*o);
    }
  }
  cx.fillStyle = "rgba(10,4,8,.75)"; sagoma(2.4); cx.fill();
  if(acceso){ cx.shadowColor = tinta; cx.shadowBlur = 16; }
  var g = cx.createLinearGradient(0, -h/2, 0, h/2);
  if(acceso){ g.addColorStop(0, "#fff6e0"); g.addColorStop(1, tinta); }
  else { g.addColorStop(0, "rgba(244,237,226,.16)"); g.addColorStop(1, "rgba(244,237,226,.07)"); }
  cx.fillStyle = g; sagoma(0); cx.fill();
  cx.shadowBlur = 0;
  cx.strokeStyle = acceso ? "rgba(255,250,235,.7)" : "rgba(244,237,226,.24)";
  cx.lineWidth = 1.2; sagoma(0); cx.stroke();
  if(testo){
    cx.fillStyle = acceso ? "rgba(30,10,18,.85)" : "rgba(244,237,226,.4)";
    cx.font = "700 " + Math.max(7, Math.round(h*0.46)) + "px -apple-system, Helvetica, sans-serif";
    cx.textAlign = "center"; cx.textBaseline = "middle";
    cx.fillText(testo, 0, forma === "freccia" ? h*0.22 : 0.5);
  }
  cx.restore();
}

/* ── il cruscotto sopra il tavolo ────────────────────────────────────────── */

   ══════════════════════════════════════════════════════════════════ */

function premiAletta(lato, giu){
  alette.forEach(function(f){ if(f.lato === lato) f.giu = giu; });
}

function spingi(dir){
  if(G.tilt || G.fase !== "gioco") return;
  G.spinte++; G.spintaT = 2.4;
  G.scossa = 0.22; G.scossaX = dir;
  palle.forEach(function(b){ if(!b.rampa){ b.vx += dir * 130; b.vy -= 40; } });
  beep(120, 0.08, "sine", 0.04);
  if(G.spinte >= 4){
    G.tilt = true;
    avviso("Tilt, hai scosso troppo");
    beep(90, 0.5, "sawtooth", 0.06);
    aggiornaPannello();
  }
}

document.addEventListener("keydown", function(e){
  if(e.repeat) return;
  if(e.key === "ArrowLeft"){ premiAletta("sx", true); e.preventDefault(); }
  else if(e.key === "ArrowRight"){ premiAletta("dx", true); e.preventDefault(); }
  else if(e.key === "ArrowDown"){ spingi(Math.random() < 0.5 ? -1 : 1); e.preventDefault(); }
  else if(e.key === " " || e.key === "Spacebar"){
    if(G.fase === "attesa" || G.fase === "fine"){ nuovaPartita(); }
    else if(G.fase === "carica"){ G.caricando = true; }
    e.preventDefault();
  }
});
document.addEventListener("keyup", function(e){
  if(e.key === "ArrowLeft") premiAletta("sx", false);
  else if(e.key === "ArrowRight") premiAletta("dx", false);
  else if(e.key === " " || e.key === "Spacebar"){
    if(G.fase === "carica" && G.caricando){ G.caricando = false; lancia(); }
  }
});

var tocchi = {};
function puntoTocco(t){
  var r = cv.getBoundingClientRect();
  return {x:(t.clientX - r.left) / r.width, y:(t.clientY - r.top) / r.height};
}
cv.addEventListener("touchstart", function(e){
  e.preventDefault();
  for(var i = 0; i < e.changedTouches.length; i++){
    var t = e.changedTouches[i], p = puntoTocco(t);
    if(G.fase === "carica" && p.y > 0.80){ G.caricando = true; tocchi[t.identifier] = "carica"; }
    else if(p.x < 0.5){ premiAletta("sx", true); tocchi[t.identifier] = "sx"; }
    else { premiAletta("dx", true); tocchi[t.identifier] = "dx"; }
  }
}, {passive:false});
cv.addEventListener("touchend", function(e){
  e.preventDefault();
  for(var i = 0; i < e.changedTouches.length; i++){
    var id = e.changedTouches[i].identifier, k = tocchi[id];
    if(k === "carica"){ G.caricando = false; lancia(); }
    else if(k === "sx") premiAletta("sx", false);
    else if(k === "dx") premiAletta("dx", false);
    delete tocchi[id];
  }
}, {passive:false});
cv.addEventListener("touchcancel", function(e){
  premiAletta("sx", false); premiAletta("dx", false);
  G.caricando = false; tocchi = {};
}, {passive:false});

cv.addEventListener("mousedown", function(e){
  var r = cv.getBoundingClientRect();
  var px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
  if(G.fase === "carica" && py > 0.80){ G.caricando = true; }
  else if(px < 0.5) premiAletta("sx", true);
  else premiAletta("dx", true);
});
document.addEventListener("mouseup", function(){
  premiAletta("sx", false); premiAletta("dx", false);
  if(G.fase === "carica" && G.caricando){ G.caricando = false; lancia(); }
});

document.getElementById("startBtn").addEventListener("click", nuovaPartita);
document.getElementById("againBtn").addEventListener("click", nuovaPartita);

/* ══════════════════════════════════════════════════════════════════
   CICLO
   ══════════════════════════════════════════════════════════════════ */

var ultimo = 0;
function ciclo(ora){
  if(!ultimo) ultimo = ora;
  var el = Math.min(0.05, (ora - ultimo) / 1000);
  ultimo = ora;

  if(G.caricando && G.fase === "carica"){
    G.carica = Math.min(1, G.carica + el * 1.35);
  }

  if(G.fase === "gioco" || G.fase === "carica"){
    var dt = el / SOTTOPASSI;
    for(var i = 0; i < SOTTOPASSI; i++) passo(dt);
  }

  disegna();
  requestAnimationFrame(ciclo);
}

/* legenda nella schermata iniziale */
(function legenda(){
  var voci = [
    ["#f4ede2", "I tre calici ti respingono e si riempiono"],

})();

aggiornaPannello();
requestAnimationFrame(ciclo);

// esposto per le prove automatiche
window.__flipper = {G:G, palle:function(){return palle;}, alette:alette, nuovaPartita:nuovaPartita,
                    lancia:lancia, W:W, H:H,
                    muri:function(){return muri;}, perni:function(){return perni;},
                    calici:function(){return respinte;}, bersagli:function(){return bersagli;},
                    RAGGIO:11};
})();
